<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>FitZone - Admin Dashboard</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f6f9; margin: 0; padding: 20px; }
        .header { display: flex; justify-content: space-between; align-items: center; background: #1a1a2e; color: white; padding: 15px 25px; border-radius: 8px; }
        .container { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 20px; }
        .card { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        input, select { width: 100%; padding: 10px; margin: 8px 0; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; }
        button { padding: 10px 15px; background: #e94560; color: white; border: none; border-radius: 5px; cursor: pointer; }
        button:hover { background: #c73650; }
        .btn-danger { background: #dc3545; padding: 6px 10px; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; background: white; border-radius: 8px; overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #eee; }
        th { background: #16213e; color: white; }
        .ACTIVE { color: green; font-weight: bold; }
        .EXPIRED, .INACTIVE { color: red; font-weight: bold; }
    </style>
</head>
<body>

    <div class="header">
        <h2>FitZone Admin Panel</h2>
        <div>
            <span id="adminName" style="margin-right: 15px;"></span>
            <button onclick="logout()">Logout</button>
        </div>
    </div>

    <div class="container">
        <!-- Form 1: Add New Member -->
        <div class="card">
            <h3>Add New Gym Member</h3>
            <input type="text" id="name" placeholder="Full Name">
            <input type="email" id="email" placeholder="Email">
            <input type="password" id="password" placeholder="Default Password">
            <input type="text" id="phone" placeholder="Phone Number">
            <button onclick="addMember()">Add Member</button>
        </div>

        <!-- Form 2: Offline Cash Payment / Plan Assignment -->
        <div class="card">
            <h3>Assign / Renew Plan (Cash Payment)</h3>
            <label>Select Member:</label>
            <select id="memberSelect"></select>
            <label>Select Plan:</label>
            <select id="planSelect"></select>
            <button onclick="assignPlan()" style="background: #28a745; margin-top: 10px;">Confirm Cash Payment & Activate</button>
        </div>
    </div>

    <!-- Members Table -->
     <!-- Search Bar -->
    <div style="margin-top: 25px; display: flex; gap: 10px; align-items: center;">
        <input type="text" id="searchInput" placeholder="Search by Gym ID (e.g. GYM101)..." 
               onkeyup="filterMembers()" 
               style="max-width: 350px; margin: 0; border: 2px solid #16213e; font-size: 15px;">
        <button onclick="clearSearch()" style="background: #6c757d;">Clear</button>
    </div>
    <table>
        <thead>
            <tr>
                <th>Gym ID</th>
                <th>Name</th>
                <th>Email / Phone</th>
                <th>Current Plan</th>
                <th>Valid Until</th>
                <th>Status</th>
                <th>Action</th>
            </tr>
        </thead>
        <tbody id="membersTable"></tbody>
    </table>

    <script>
        const user = JSON.parse(localStorage.getItem("gymUser"));
        if (!user || user.role !== "ADMIN") {
            window.location.href = "/login.html";
        } else {
            document.getElementById("adminName").innerText = "Admin: " + user.name;
        }

        let allMembers = [];

        async function loadData() {
            // Load Members
            const memRes = await fetch("/api/admin/members");
            allMembers = await memRes.json();

            const memberSelect = document.getElementById("memberSelect");
            memberSelect.innerHTML = "";
            allMembers.forEach(m => {
                memberSelect.innerHTML += `<option value="${m.id}">${m.name} (${m.gymCode})</option>`;
            });

            renderTable(allMembers);

            // Load Plans
            const planRes = await fetch("/api/admin/plans");
            const plans = await planRes.json();
            const planSelect = document.getElementById("planSelect");
            planSelect.innerHTML = "";
            plans.forEach(p => {
                planSelect.innerHTML += `<option value="${p.id}">${p.planName} - ₹${p.price} (${p.durationDays} days)</option>`;
            });
        }

        function renderTable(membersList) {
            const tbody = document.getElementById("membersTable");
            tbody.innerHTML = "";

            if (membersList.length === 0) {
                tbody.innerHTML = `<tr><td colspan="7" style="text-align:center; color:#888;">No member found with that Gym ID.</td></tr>`;
                return;
            }

            membersList.forEach(m => {
                tbody.innerHTML += `
                    <tr>
                        <td><strong>${m.gymCode}</strong></td>
                        <td>${m.name}</td>
                        <td>${m.email}<br><small>${m.phone || ''}</small></td>
                        <td>${m.planName}</td>
                        <td>${m.endDate}</td>
                        <td class="${m.status}">${m.status}</td>
                        <td><button class="btn-danger" onclick="deleteMember(${m.id})">Delete</button></td>
                    </tr>
                `;
            });
        }

        function filterMembers() {
            const query = document.getElementById("searchInput").value.trim().toUpperCase();
            if (!query) {
                renderTable(allMembers);
                return;
            }
            const filtered = allMembers.filter(m => m.gymCode.toUpperCase().includes(query));
            renderTable(filtered);
        }

        function clearSearch() {
            document.getElementById("searchInput").value = "";
            renderTable(allMembers);
        }

        async function addMember() {
            const payload = {
                name: document.getElementById("name").value,
                email: document.getElementById("email").value,
                password: document.getElementById("password").value,
                phone: document.getElementById("phone").value
            };
            const res = await fetch("/api/admin/members", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(payload)
            });
            const data = await res.json();
            if (res.ok) {
                alert("Member added! Gym ID: " + data.gymCode);
                loadData();
            } else {
                alert(data.error);
            }
        }

        async function assignPlan() {
            const payload = {
                userId: parseInt(document.getElementById("memberSelect").value),
                planId: parseInt(document.getElementById("planSelect").value)
            };
            const res = await fetch("/api/admin/subscribe", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(payload)
            });
            const data = await res.json();
            alert(data.message);
            loadData();
        }

        async function deleteMember(id) {
            if (confirm("Are you sure you want to delete this member?")) {
                await fetch(`/api/admin/members/${id}`, { method: "DELETE" });
                loadData();
            }
        }

        function logout() {
            localStorage.removeItem("gymUser");
            window.location.href = "/login.html";
        }

        loadData();
    </script>
</body>
</html>
